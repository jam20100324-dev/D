<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>英文單字複習器</title>
  <style>
    :root {
      --primary-color: #4a6fa5;
      --primary-hover: #3b5984;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --text-muted: #666666;
      --border-color: #e0e0e0;
      --correct-color: #4caf50;
      --wrong-color: #f44336;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      padding: 20px 12px;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 24px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .header-title {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .header-subtitle {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      margin: 16px 0 10px 0;
    }

    /* 分類頁籤 Tab */
    .category-tabs {
      display: flex;
      background: #eef2f7;
      border-radius: 10px;
      padding: 4px;
      gap: 4px;
      margin-bottom: 12px;
    }

    .category-tab {
      flex: 1;
      border: none;
      background: transparent;
      padding: 8px 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .category-tab.active {
      background: var(--card-bg);
      color: var(--primary-color);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    /* 單元網格 */
    .unit-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn-option {
      background: #fff;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-color);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .btn-option.selected {
      background: var(--primary-color);
      color: #fff;
      border-color: var(--primary-color);
    }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 24px;
    }

    .btn-action {
      width: 100%;
      background: var(--primary-color);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-action:hover {
      background: var(--primary-hover);
    }

    /* 答題畫面 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .btn-back {
      background: #f0f2f5;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .progress-text {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .question-area {
      text-align: center;
      margin: 20px 0;
    }

    .sentence-box {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 12px;
      min-height: 60px;
    }

    .hint-box {
      font-size: 13px;
      color: var(--primary-color);
      background: #eef4ff;
      padding: 6px 12px;
      border-radius: 6px;
      display: inline-block;
      margin-top: 6px;
      visibility: hidden; /* 預設隱藏，答題後顯示 */
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }

    .option-card {
      background: #fff;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      color: var(--primary-color);
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-card.correct {
      border-color: var(--correct-color);
      background: #e8f5e9;
      color: var(--correct-color);
    }

    .option-card.wrong {
      border-color: var(--wrong-color);
      background: #ffebee;
      color: var(--wrong-color);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- 設定主畫面 -->
    <div id="setup-screen">
      <h1 class="header-title">英文單字複習器</h1>
      <div class="header-subtitle">請選擇書籍與單元範圍</div>

      <div class="section-title">1. 選擇書籍分類</div>
      <div class="category-tabs">
        <button class="category-tab active" onclick="switchCategory('magazine')">雜誌</button>
        <button class="category-tab" onclick="switchCategory('textbook')">課本</button>
        <button class="category-tab" onclick="switchCategory('vocabulary')">單字書</button>
      </div>

      <div class="section-title">2. 選擇單元範圍</div>
      <div id="unit-container" class="unit-grid">
        <!-- 由 JavaScript 動態生成單元按鈕 -->
      </div>

      <div class="section-title">3. 選擇複習模式</div>
      <div class="mode-grid">
        <button class="btn-option" onclick="selectMode(this, 'flashcard')">閃卡翻面</button>
        <button class="btn-option" onclick="selectMode(this, 'eng2chi')">看英選中</button>
        <button class="btn-option" onclick="selectMode(this, 'chi2eng')">看中選英</button>
        <button class="btn-option selected" onclick="selectMode(this, 'fill')">📝 句子填空題</button>
      </div>

      <button class="btn-action" onclick="startQuiz()">開始複習</button>
    </div>

    <!-- 答題畫面 -->
    <div id="quiz-screen" class="hidden">
      <div class="top-bar">
        <button class="btn-back" onclick="goBack()">← 返回設定</button>
        <span class="progress-text" id="progress-indicator">1 / 10</span>
      </div>

      <div class="question-area">
        <div class="sentence-box" id="question-text">
          Cherry ______s bloom in spring.
        </div>
        <!-- 答案提示：預設 hidden，選完選項後再顯示 -->
        <div class="hint-box" id="hint-text">
          U6 | 中文意思：花朵；開花
        </div>
      </div>

      <div class="options-list" id="options-container">
        <!-- 動態渲染選項 -->
      </div>
    </div>

  </div>

  <script>
    // 1. 分類單元資料結構
    const wordData = {
      magazine: {
        units: ['Unit 4', 'Unit 5', 'Unit 6', 'Unit 7', 'Unit 8', 'Unit 9', 'Unit 10', 'Unit 11', 'Unit 12', 'Unit 13', 'Unit 14', 'Unit 17', 'Unit 18', 'R2'],
        words: [
          { word: 'blossom', sentence: 'Cherry ______s bloom in spring.', choices: ['guide', 'spot', 'blossom', 'opposition'], answer: 'blossom', unit: 'U6', meaning: '花朵；開花' },
          { word: 'guide', sentence: 'The ______ showed us around the museum.', choices: ['guide', 'spot', 'blossom', 'opposition'], answer: 'guide', unit: 'U6', meaning: '導覽；嚮導' }
        ]
      },
      textbook: {
        units: ['Lesson 1', 'Lesson 2', 'Lesson 3', 'Lesson 4', 'Lesson 5', 'Review 1'],
        words: [
          { word: 'challenge', sentence: 'Learning a new language is a great ______.', choices: ['challenge', 'habit', 'purpose', 'method'], answer: 'challenge', unit: 'L1', meaning: '挑戰' }
        ]
      },
      vocabulary: {
        units: ['Level 1', 'Level 2', 'Level 3', 'Level 4', 'Level 5'],
        words: [
          { word: 'abandon', sentence: 'They had to ______ the car after the engine failed.', choices: ['abandon', 'achieve', 'absorb', 'accept'], answer: 'abandon', unit: 'L1', meaning: '放棄；拋棄' }
        ]
      }
    };

    let currentCategory = 'magazine';
    let selectedUnit = 'Unit 6';
    let selectedMode = 'fill';
    let currentIndex = 0;
    let quizList = [];

    // 切換書籍分類
    function switchCategory(catKey) {
      currentCategory = catKey;
      
      // 更新 Tab 樣式
      document.querySelectorAll('.category-tab').forEach((tab, index) => {
        const keys = ['magazine', 'textbook', 'vocabulary'];
        tab.classList.toggle('active', keys[index] === catKey);
      });

      // 重新渲染該分類的單元列表
      renderUnits();
    }

    // 渲染單元按鈕
    function renderUnits() {
      const container = document.getElementById('unit-container');
      container.innerHTML = '';
      
      const units = wordData[currentCategory].units;
      selectedUnit = units[0] || ''; // 預設選取第一個單元

      units.forEach(unit => {
        const btn = document.createElement('button');
        btn.className = `btn-option ${unit === selectedUnit ? 'selected' : ''}`;
        btn.innerText = unit;
        btn.onclick = () => {
          document.querySelectorAll('#unit-container .btn-option').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          selectedUnit = unit;
        };
        container.appendChild(btn);
      });
    }

    // 選擇模式
    function selectMode(btn, mode) {
      document.querySelectorAll('.mode-grid .btn-option').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedMode = mode;
    }

    // 開始複習
    function startQuiz() {
      document.getElementById('setup-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');
      
      // 取得目前書籍與單元題目（若無相符則帶入預設資料）
      quizList = wordData[currentCategory].words;
      currentIndex = 0;
      loadQuestion();
    }

    // 載入題目
    function loadQuestion() {
      const currentQ = quizList[currentIndex] || wordData.magazine.words[0];
      
      // 更新進度
      document.getElementById('progress-indicator').innerText = `${currentIndex + 1} / ${quizList.length}`;
      
      // 設定題目內容
      document.getElementById('question-text').innerText = currentQ.sentence;
      
      // 設定提示文字並【隱藏】
      const hintElem = document.getElementById('hint-text');
      hintElem.innerText = `${currentQ.unit} | 中文意思：${currentQ.meaning}`;
      hintElem.style.visibility = 'hidden';

      // 生成選項
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      currentQ.choices.forEach(choice => {
        const card = document.createElement('div');
        card.className = 'option-card';
        card.innerText = choice;
        card.onclick = () => handleAnswer(card, choice, currentQ.answer);
        optionsContainer.appendChild(card);
      });
    }

    // 選擇答案處理
    function handleAnswer(selectedCard, chosenOption, correctAnswer) {
      // 點擊後【顯示中文提示與單元資訊】
      document.getElementById('hint-text').style.visibility = 'visible';

      const options = document.querySelectorAll('.option-card');
      options.forEach(opt => {
        opt.style.pointerEvents = 'none'; // 防止重複點擊
        if (opt.innerText === correctAnswer) {
          opt.classList.add('correct');
        }
      });

      if (chosenOption !== correctAnswer) {
        selectedCard.classList.add('wrong');
      }

      // 1.5 秒後跳下一題
      setTimeout(() => {
        currentIndex++;
        if (currentIndex < quizList.length) {
          loadQuestion();
        } else {
          alert('複習完成！');
          goBack();
        }
      }, 1500);
    }

    // 返回設定
    function goBack() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('setup-screen').classList.remove('hidden');
    }

    // 初始化頁面
    renderUnits();
  </script>
</body>
</html>
